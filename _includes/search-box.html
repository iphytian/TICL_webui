<div class="search-box">
  <input
    type="text"
    class="search-input"
    oninput="onSearchInput(this)"
    data-placeholder-zh="在此页搜索内容"
    data-placeholder-en="Search items on this page"
    placeholder="在此页搜索内容"
  />
  <button
    disabled
    data-tooltip="Clear search"
    aria-label="clear search"
    onclick="onSearchClear()"
  >
    {% include icon.html icon="fa-solid fa-magnifying-glass" %}
  </button>
</div>
