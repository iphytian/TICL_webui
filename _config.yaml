# site properties and page defaults
title: 望远镜智能控制实验室
subtitle: Telescope Intelligent Control Laboratory
description: 望远镜智能控制实验室（Telescope Intelligent Control Laboratory）——由望远镜技术专家崔向群院士和人工智能技术专家王怀清教授领衔，致力于融合人工智能方法与天文光学前沿技术，研究大口径光学望远镜的智能光学设计与加工、自主运行与健康管理、成像优化与数据处理等关键技术。Led by Academician Cui Xiangqun and Prof. Wang Huaiqing, the laboratory integrates AI methods with astronomical optics to study key technologies for the intelligent optical design and manufacturing, autonomous operation and health management, and imaging optimization and data processing of large-aperture optical telescopes.
